[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-format-fix"
description = "Extract, restyle, and convert text across common document formats."
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "niktifin47" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
pdf = ["pypdf>=4", "reportlab>=4"]
rtf = ["striprtf>=0.0.26"]
odt = ["odfpy>=1.4.1"]
all = [
    "python-docx>=1.1",
    "pypdf>=4",
    "reportlab>=4",
    "striprtf>=0.0.26",
    "odfpy>=1.4.1",
]
dev = ["pytest>=8", "ruff>=0.6", "build>=1"]
windows = ["pyinstaller>=6"]

[project.urls]
Homepage = "https://github.com/niktifin47/document-format-toolkit"
Repository = "https://github.com/niktifin47/document-format-toolkit"
PyPI = "https://pypi.org/project/api-format-fix/"

[project.scripts]
api-format-fix = "api_format_fix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "api_format_fix.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=long --durations=10 --strict-config --strict-markers --junitxml=reports/pytest.xml"
verbosity_assertions = 2
junit_logging = "all"
junit_log_passing_tests = false

[tool.ruff]
line-length = 100
target-version = "py310"
