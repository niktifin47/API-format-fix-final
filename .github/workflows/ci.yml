name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install quality tools
        run: |
          mkdir -p reports
          python -m pip install -e ".[dev]" 2>&1 | tee reports/install.log
      - name: Record environment
        if: ${{ always() }}
        run: |
          mkdir -p reports
          {
            python -VV
            python -m pip list --format=freeze
          } > reports/environment.txt 2>&1
      - name: Lint
        run: python -m ruff check . 2>&1 | tee reports/ruff.log
      - name: Build distributions
        if: ${{ !cancelled() }}
        run: python -m build 2>&1 | tee reports/build.log
      - name: Upload quality diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: reports/
          retention-days: 14

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/test-python
        with:
          python-version: ${{ matrix.python-version }}
          artifact-name: python-${{ matrix.os }}-${{ matrix.python-version }}-reports

  test-macos:
    name: test (macos-latest, Python 3.10-3.14)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Test Python 3.10
        id: python310
        uses: ./.github/actions/test-python
        continue-on-error: true
        timeout-minutes: 3
        with:
          python-version: "3.10"
          artifact-name: python-macos-latest-3.10-reports
      - name: Test Python 3.11
        id: python311
        uses: ./.github/actions/test-python
        continue-on-error: true
        timeout-minutes: 3
        with:
          python-version: "3.11"
          artifact-name: python-macos-latest-3.11-reports
      - name: Test Python 3.12
        id: python312
        uses: ./.github/actions/test-python
        continue-on-error: true
        timeout-minutes: 3
        with:
          python-version: "3.12"
          artifact-name: python-macos-latest-3.12-reports
      - name: Test Python 3.13
        id: python313
        uses: ./.github/actions/test-python
        continue-on-error: true
        timeout-minutes: 3
        with:
          python-version: "3.13"
          artifact-name: python-macos-latest-3.13-reports
      - name: Test Python 3.14
        id: python314
        uses: ./.github/actions/test-python
        continue-on-error: true
        timeout-minutes: 3
        with:
          python-version: "3.14"
          artifact-name: python-macos-latest-3.14-reports
      - name: Verify macOS test results
        if: ${{ !cancelled() }}
        env:
          PYTHON_310: ${{ steps.python310.outcome }}
          PYTHON_311: ${{ steps.python311.outcome }}
          PYTHON_312: ${{ steps.python312.outcome }}
          PYTHON_313: ${{ steps.python313.outcome }}
          PYTHON_314: ${{ steps.python314.outcome }}
        run: |
          failed=0
          for result in "3.10:$PYTHON_310" "3.11:$PYTHON_311" "3.12:$PYTHON_312" \
                        "3.13:$PYTHON_313" "3.14:$PYTHON_314"; do
            if [ "${result#*:}" != "success" ]; then
              echo "::error::macOS Python ${result%%:*} did not pass (${result#*:})"
              failed=1
            fi
          done
          exit "$failed"
      - name: Upload partial macOS diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: python-macos-partial-reports
          path: reports/
          retention-days: 14

  linux-distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-22.04, image: "ubuntu:22.04" }
          - { name: ubuntu-24.04, image: "ubuntu:24.04" }
          - { name: debian-bookworm, image: "debian:bookworm" }
          - { name: fedora, image: "fedora:latest" }
          - { name: archlinux, image: "archlinux:latest" }
    steps:
      - uses: actions/checkout@v5
      - name: Cache container Python packages
        uses: actions/cache@v4
        with:
          path: .cache/ci-pip
          key: distro-${{ matrix.name }}-pip-${{ hashFiles('pyproject.toml') }}
      - name: Test in Linux distribution container
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p reports .cache/ci-pip
          docker run --rm \
            --volume "$PWD:/workspace" \
            --volume "$PWD/.cache/ci-pip:/pip-cache" \
            --workdir /workspace \
            --env PIP_CACHE_DIR=/pip-cache \
            "$IMAGE" \
            bash -euo pipefail -c '
              cat /etc/os-release > reports/environment.txt
              if command -v apt-get >/dev/null 2>&1; then
                apt-get update
                apt-get install -y python3 python3-pip python3-venv
              elif command -v pacman >/dev/null 2>&1; then
                pacman -Syu --noconfirm python python-pip
                PYTHON=python
              else
                dnf install -y python3 python3-pip
                PYTHON=python3
              fi
              PYTHON="${PYTHON:-python3}"
              "$PYTHON" -VV >> reports/environment.txt 2>&1
              "$PYTHON" -m venv /tmp/api-format-fix-venv
              /tmp/api-format-fix-venv/bin/python -m pip install -e ".[all,dev]"
              /tmp/api-format-fix-venv/bin/python -m pip list --format=freeze >> reports/environment.txt
              /tmp/api-format-fix-venv/bin/python -m pytest
            ' 2>&1 | tee reports/container.log
      - name: Upload container diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.name }}-reports
          path: reports/
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Record environment
        run: |
          mkdir -p reports
          {
            java -version
            bash ./gradlew --version
          } > reports/environment.txt 2>&1
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" 2>&1 | tee reports/sdk-install.log
      - name: Test, build, and lint Android
        run: |
          bash ./gradlew :android:testDebugUnitTest :android:assembleDebug :android:lintDebug \
            --no-daemon --build-cache --continue --stacktrace --console=plain 2>&1 | tee reports/gradle.log
      - name: Upload Android diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            reports/
            android/build/reports/
            android/build/test-results/
          retention-days: 14

  ci-status:
    name: CI
    if: ${{ always() }}
    needs: [quality, test, test-macos, linux-distros, android]
    runs-on: ubuntu-latest
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
      TEST_RESULT: ${{ needs.test.result }}
      MACOS_RESULT: ${{ needs.test-macos.result }}
      DISTRO_RESULT: ${{ needs.linux-distros.result }}
      ANDROID_RESULT: ${{ needs.android.result }}
    steps:
      - name: Verify CI jobs passed
        run: |
          {
            echo "## CI results"
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Lint and package build | $QUALITY_RESULT |"
            echo "| Python Linux/Windows matrix | $TEST_RESULT |"
            echo "| Python macOS 3.10-3.14 | $MACOS_RESULT |"
            echo "| Linux distributions | $DISTRO_RESULT |"
            echo "| Android | $ANDROID_RESULT |"
            echo
            echo "Download the reports artifact for the original failing job: logs, runtime/dependency versions, and test reports."
            echo 'Python: install `python -m pip install -e ".[all,dev]"` using the failing OS/Python version, then run `python -m pytest "tests/test_file.py::test_name"` with the node ID from the failure summary.'
            echo 'Android: run `bash ./gradlew :android:testDebugUnitTest :android:assembleDebug :android:lintDebug --continue --stacktrace --console=plain` (use `.\gradlew.bat` on Windows).'
            echo "CodeQL is separate; passing tests do not establish security."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$QUALITY_RESULT" != "success" ] || [ "$TEST_RESULT" != "success" ] || [ "$MACOS_RESULT" != "success" ] || [ "$DISTRO_RESULT" != "success" ] || [ "$ANDROID_RESULT" != "success" ]; then
            exit 1
          fi

