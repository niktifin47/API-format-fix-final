name: Record merged pull requests

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: merge-project-summary-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  record-merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # Never check out the pull request's head in this privileged workflow.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - name: Add merged pull request to project
        env:
          GH_TOKEN: ${{ secrets.PROJECT }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh project item-add 1 --owner niktifin47 --url "$PR_URL"
      - name: Record summary and propose planning update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/record_merge_summary.py
