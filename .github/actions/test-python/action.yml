name: Test Python
description: Run the Python tests and upload diagnostics for one interpreter.
inputs:
  python-version:
    description: Python version to test
    required: true
  artifact-name:
    description: Name of the diagnostics artifact
    required: true
runs:
  using: composite
  steps:
    - name: Set up Python
      id: setup
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: Linux_MacOs_Windows support/pyproject.toml
    - name: Install test dependencies
      shell: bash
      env:
        REPORT_DIR: reports/${{ inputs.python-version }}
      run: |
        mkdir -p "$REPORT_DIR"
        python -m pip install -e "./Linux_MacOs_Windows support[all,dev]" 2>&1 | tee "$REPORT_DIR/install.log"
    - name: Record environment
      if: ${{ always() }}
      shell: bash
      env:
        REPORT_DIR: reports/${{ inputs.python-version }}
        PYTHON_VERSION: ${{ inputs.python-version }}
        SETUP_OUTCOME: ${{ steps.setup.outcome }}
      run: |
        mkdir -p "$REPORT_DIR"
        {
          echo "Requested Python: $PYTHON_VERSION"
          echo "Python setup: $SETUP_OUTCOME"
          if [ "$SETUP_OUTCOME" = "success" ]; then
            python -VV
            python -c "import platform; print(platform.platform())"
            python -m pip list --format=freeze
          fi
        } > "$REPORT_DIR/environment.txt" 2>&1
    - name: Run tests
      shell: bash
      env:
        REPORT_DIR: reports/${{ inputs.python-version }}
      run: |
        cd "Linux_MacOs_Windows support"
        python -m pytest --junitxml="../$REPORT_DIR/pytest.xml" 2>&1 | tee "../$REPORT_DIR/pytest.log"
    - name: Upload test diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: reports/${{ inputs.python-version }}/
        retention-days: 14
